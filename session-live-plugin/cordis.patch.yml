# The session-live layer: one insert naming this package. `dsh plugin` adds this
# package to dsh.profile.bundles because it declares dsh.bundle, and the patch
# below is what makes the row a mounted Loader entry.
#
# No `config` block: this plugin has no settings. Its view reads what the client
# already publishes — projections for context occupancy and session totals, the
# session's own event window for the per-step and per-tool detail — so there is
# nothing to configure and nothing to hardcode either.
- insert:
    - id: session-live
      name: 'dsh-session-live'
